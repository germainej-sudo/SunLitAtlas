[preset.0]
name="Windows Desktop"
platform="Windows Desktop"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="data/*.json"
exclude_filter="docs/*,tests/*,tools/*,README.md"
export_path=""
script_export_mode=2

[preset.0.options]
custom_template/debug=""
custom_template/release=""
debug/export_console_wrapper=1
binary_format/embed_pck=true
texture_format/bptc=true
texture_format/s3tc=true
texture_format/etc2=false
binary_format/architecture="x86_64"

; Browser access test. This preset does not publish or deploy anything.
; Keep student_test: optional AI network requests are disabled in this build.
[preset.1]
name="Web Student Test"
platform="Web"
runnable=true
advanced_options=false
dedicated_server=false
custom_features="student_test"
export_filter="all_resources"
include_filter="data/*.json"
exclude_filter="docs/*,tests/*,tools/*,builds/*,README.md,MANIFEST.sha256,.env,.env.*"
export_path="builds/web_student/index.html"
script_export_mode=2

[preset.1.options]
custom_template/debug=""
custom_template/release=""
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=true
html/export_icon=true
html/custom_html_shell=""
html/head_include="<meta name=\"robots\" content=\"noindex, nofollow\" />"
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=false
progressive_web_app/ensure_cross_origin_isolation_headers=false
